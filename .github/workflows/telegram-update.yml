name: Telegram Update

# Wird vom Cloudflare Worker (infra/telegram-webhook/worker.js) per
# repository_dispatch ausgeloest, sobald Telegram eine Nachricht oder einen
# Button-Klick per Webhook zustellt. Verarbeitet genau dieses eine Update
# sofort, statt auf den naechsten Scan-Cron zu warten. Siehe
# docs/adr/0006-telegram-webhook.md und docs/telegram-webhook-setup.md.

on:
  repository_dispatch:
    types: [telegram_update]

permissions:
  contents: write

# Bewusst PRO Update eine eigene Gruppe, nicht die gemeinsame "gravel-scan"
# von scan.yml: GitHub verwirft bei geteilten Gruppen jeden bereits
# wartenden (noch nicht gestarteten) Lauf, sobald ein neuerer dazukommt —
# nur der gerade laufende plus der zuletzt eingereihte ueberleben. Bei
# schnellem Hintereinander-Tippen (z.B. mehrere Radtyp-Buttons in /setup)
# wurden dadurch mittlere Taps stillschweigend nie verarbeitet. Mit einer
# eindeutigen Gruppe je Update laeuft garantiert jeder Tap; das dafuer
# noetige gemeinsame Schreiben von state.json sichert stattdessen der
# Retry-Loop im Schritt "Preisdaten sichern" ab.
concurrency:
  group: gravel-telegram-${{ github.event.client_payload.update_id }}

jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 lxml

      - name: Update verarbeiten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_MODE: "1"
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_UPDATE_JSON: ${{ toJson(github.event.client_payload) }}
        run: python bot.py --telegram-update

      - name: Preisdaten sichern
        run: |
          git config user.name  "gravel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "keine Aenderung"
            exit 0
          fi
          git commit -m "Telegram-Update $(date -u +%Y-%m-%dT%H:%M)"
          # Ohne die gemeinsame "gravel-scan"-Gruppe (siehe concurrency oben)
          # koennen mehrere Updates gleichzeitig hier ankommen und um denselben
          # Push konkurrieren — retry statt einmaligem Versuch.
          for versuch in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push; then
              echo "state.json gespeichert (Versuch $versuch)"
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $versuch von 5), erneuter Versuch..."
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::state.json konnte nach 5 Versuchen nicht gespeichert werden"
          exit 1
