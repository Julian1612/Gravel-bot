name: Gravel Scan

on:
  schedule:
    - cron: "*/30 5-21 * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "Was soll passieren?"
        type: choice
        default: normal
        options:
          - normal
          - probelauf
          - telegram-test
          - befehle-registrieren

permissions:
  contents: write

concurrency:
  group: gravel-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 lxml

      - name: Lauf
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_MODE: ${{ vars.TELEGRAM_WEBHOOK_MODE }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          case "${{ inputs.modus || 'normal' }}" in
            probelauf)             python bot.py --dry-run ;;
            telegram-test)         python bot.py --test-telegram ;;
            befehle-registrieren)  python bot.py --register-commands ;;
            *)                     python bot.py ;;
          esac

      - name: Preisdaten sichern
        if: ${{ (inputs.modus || 'normal') == 'normal' }}
        run: |
          git config user.name  "gravel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "keine Aenderung"
            exit 0
          fi
          git commit -m "Preisdaten $(date -u +%Y-%m-%dT%H:%M)"
          # telegram-update.yml laeuft in einer eigenen Concurrency-Gruppe je
          # Update (siehe dort) und kann daher gleichzeitig mit diesem Lauf
          # state.json aendern wollen — retry statt einmaligem Versuch.
          for versuch in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push; then
              echo "state.json gespeichert (Versuch $versuch)"
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $versuch von 5), erneuter Versuch..."
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::state.json konnte nach 5 Versuchen nicht gespeichert werden"
          exit 1
